*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips:empty{display:none}
.chip{display:flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:5px 8px 5px 12px;font-size:13.5px;font-weight:600}
.chip span{font-size:15px;opacity:.7}
main{padding:6px 16px calc(var(--safe-b) + 40px);max-width:720px;margin:0 auto}
.sum{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.sum .l{font-size:14px;color:var(--sub)}
.sum .v{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:2px 0 14px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.split i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--sub)}
.legend b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 4px 10px}
.sec h2{margin:0;font-size:17px;font-weight:700}
.sec span{font-size:13px;color:var(--faint)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:18px;padding:14px;text-align:left;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:2px;min-height:112px}

.tile .n{font-size:14.5px;font-weight:600;line-height:1.3}
.tile .m{font-size:12.5px;color:var(--sub);margin-top:auto}
.deps{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.dep{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-top:1px solid var(--line)}
.dep:first-child{border-top:0}
.dep .t{flex:1;min-width:0}
.dep .t div:first-child{font-weight:600;font-size:15px}
.dep .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.dep .bar i{display:block;height:100%;background:var(--acc);border-radius:2px}
.dep .r{text-align:right;font-size:13px;color:var(--sub);white-space:nowrap}
.dep .r b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.chev{color:var(--faint);font-size:18px}
.showall{display:block;width:100%;padding:12px;font-size:14.5px;font-weight:600;color:var(--acc);border-top:1px solid var(--line)}
.lhead{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 10px;font-size:14px;color:var(--sub)}
.lhead b{color:var(--ink);font-weight:700}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--acc-soft);display:grid;place-items:center;font-size:19px}
.row .ic.sw{background:var(--sw-soft)}
.row .t{flex:1;min-width:0}
.row .nm{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mt{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .p{flex:none;font-size:14.5px;font-weight:600}
.more{display:block;width:100%;padding:14px;font-weight:600;color:var(--acc);border-top:1px solid var(--line)}
.empty{text-align:center;color:var(--sub);padding:50px 20px}
.scrim{position:fixed;inset:0;background:rgba(15,18,25,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:8px 20px calc(var(--safe-b) + 20px);max-width:720px;margin:0 auto}
.sheet.on{transform:none}

.sheet h3{margin:0 0 4px;font-size:20px;font-weight:700;line-height:1.35}
.fg{margin-top:18px}

.pills{display:flex;flex-wrap:wrap;gap:8px}

.pill.on{background:var(--acc);color:#fff}
.pill small{opacity:.65;margin-left:2px}
.sbtns{display:flex;gap:10px;margin-top:22px}
.sbtns button{flex:1;border-radius:14px;padding:14px;font-weight:600;background:var(--card)}
.sbtns .pri{background:var(--acc);color:#fff}
.dcard{background:var(--card);border-radius:18px;padding:4px 16px;margin-top:14px}
.dl{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);font-size:15px}
.dl:first-child{border-top:0}
.dl span:first-child{color:var(--sub)}
.dl span:last-child{text-align:right;font-weight:500;word-break:break-word}
.price{font-size:28px;font-weight:700;margin-top:10px}
.badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--acc-soft);color:var(--acc);margin-top:6px}
.badge.sw{background:var(--sw-soft);color:var(--sw)}
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 30px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:40;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%)}

.mon{display:flex;align-items:center;gap:8px;margin-top:10px}

.mon b{flex:1;text-align:center;font-size:16px}
.prog{background:var(--card);border-radius:20px;padding:16px 18px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;align-items:center;gap:16px}

.ring span{background:var(--card);width:50px;height:50px;border-radius:50%;display:grid;place-items:center}
.prog .t b{display:block;font-size:17px}.prog .t span{font-size:13.5px;color:var(--sub)}
.loc{margin:20px 4px 8px;font-size:15px;font-weight:700;color:var(--sub)}
.cp{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:13px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.04)}

.stp{display:grid;grid-template-columns:1fr;gap:8px}

.so i{font-style:normal;font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.rep td,.rep th{border:1px solid #333;padding:5px 6px;vertical-align:middle}
.rep th{font-weight:600;background:#f4f4f4}
.rep .c{text-align:center}
.rep img{width:90px;height:64px;object-fit:cover;border-radius:3px;margin:2px}
.rep .bad{color:#c0262d;font-weight:600}
.exp{display:flex;gap:10px;margin:14px 0}
.exp button{flex:1;border-radius:14px;padding:14px;font-weight:600;background:var(--acc);color:#fff}
.exp button.sec2{background:var(--card);color:var(--ink)}
.hint{font-size:12.5px;color:var(--faint);margin:6px 4px}
.cf{display:none;background:var(--card);border-radius:14px;padding:14px;margin-top:12px;font-weight:600}.cf.on{display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}

.exp button:disabled{opacity:.6}
.exp3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.exp3 button{border-radius:14px;padding:13px 6px;font-weight:600;font-size:14px;background:var(--acc);color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.exp3 button small{font-weight:500;font-size:11.5px;opacity:.85}
.exp3 button.alt{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.05)}

const SCOPES=['User.Read','Sites.ReadWrite.All','Sites.Manage.All'];
let msal=null,account=null,siteId='',listId='',itemIds={},photoCache=new Map(),pollT=null;
async function token(){
  try{return (await msal.acquireTokenSilent({scopes:SCOPES,account})).accessToken}
  catch(e){await msal.acquireTokenRedirect({scopes:SCOPES,account});throw e}
}
async function g(path,opt={}){
  const t=await token();const headers={Authorization:'Bearer '+t,...(opt.headers||{})};let body=opt.body;
  if(opt.json){headers['Content-Type']='application/json';body=JSON.stringify(opt.json)}
  const r=await fetch(path.startsWith('http')?path:'https://graph.microsoft.com/v1.0'+path,{method:opt.method||'GET',headers,body});
  if(!r.ok){let b='';try{b=await r.text()}catch(_){};let m='';try{m=JSON.parse(b).error.message}catch(_){};const err=new Error((opt.method||'GET')+' '+path.split('?')[0]+(m?' : '+m:''));err.status=r.status;err.body=b;throw err}
  if(opt.raw)return r;return r.status===204?null:r.json();
}

const graphStore={
  async connect(){
    const u=new URL(CFG.siteUrl);const p=u.pathname.replace(/\/+$/,'');
    siteId=(await g(p?`/sites/${u.hostname}:${p}`:`/sites/${u.hostname}`)).id;
    let all=[],next=`/sites/${siteId}/lists?$select=id,displayName&$top=200`;
    while(next){const r=await g(next);all=all.concat(r.value);next=r['@odata.nextLink']}
    const f=all.find(l=>l.displayName===CFG.listName);
    if(f)listId=f.id;
    else listId=(await g(`/sites/${siteId}/lists`,{method:'POST',json:{displayName:CFG.listName,columns:LISTCOLS,list:{template:'genericList'}}})).id;
  },
  async load(){
    let items=[],next=`/sites/${siteId}/lists/${listId}/items?$expand=fields($select=Title,Data)&$top=500`;
    while(next){const r=await g(next);items=items.concat(r.value);next=r['@odata.nextLink']}
    const ck={},ids={};let st={};
    for(const it of items){const t=it.fields&&it.fields.Title;if(!t)continue;ids[t]=it.id;
      let d={};try{d=JSON.parse(it.fields.Data||'{}')}catch(_){}
      if(t==='__settings')st=d;else ck[t]=d}
    itemIds=ids;return {checks:ck,settings:st};
  },
  async put(k,d,extra={}){
    const fields={Title:k,Data:JSON.stringify(d),...extra};
    if(itemIds[k])await g(`/sites/${siteId}/lists/${listId}/items/${itemIds[k]}/fields`,{method:'PATCH',json:fields});
    else itemIds[k]=(await g(`/sites/${siteId}/lists/${listId}/items`,{method:'POST',json:{fields}})).id;
  },
  async del(k){if(itemIds[k]){await g(`/sites/${siteId}/lists/${listId}/items/${itemIds[k]}`,{method:'DELETE'});delete itemIds[k]}},
  async upload(blob,name){
    const path=encodeURIComponent(CFG.photoFolder)+'/'+ym+'/'+encodeURIComponent(name);
    const r=await g(`/sites/${siteId}/drive/root:/${path}:/content?@microsoft.graph.conflictBehavior=rename`,{method:'PUT',body:blob,headers:{'Content-Type':'image/jpeg'}});
    return r.id;
  },
  async blob(id){const r=await g(`/sites/${siteId}/drive/items/${id}/content`,{raw:true});return await r.blob()}
};

async function exportXlsx(){
  if(!window.ExcelJS){toast('ตัวสร้าง Excel ยังโหลดไม่เสร็จ ลองอีกครั้ง');return}
  const btn=$('xls');btn.disabled=true;btn.innerHTML='<span class="spin"></span> กำลังสร้างไฟล์…';
  try{
    const bin=Uint8Array.from(atob(TPL),c=>c.charCodeAt(0));
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(bin.buffer);
    const ws=wb.worksheets[0];
    const font={name:'TH SarabunPSK',size:16};
    ws.getCell('A5').value='รายละเอียดการตรวจสอบการใช้โทรศัพท์ในเวลาปฏิบัติงาน ประจำเดือน '+mLabel(ym);
    const setTxt=(addr,v,al='center')=>{const c=ws.getCell(addr);c.value=v;c.alignment={vertical:'middle',horizontal:al,wrapText:true}};
    for(const g of DATEGROUPS){const ds=[...new Set(g.map(r=>get(r)).filter(Boolean).map(e=>thShort(e.date)))];setTxt('C'+g[0],ds.join('\n'))}
    const lines=(s,w)=>String(s||'').split('\n').reduce((t,l)=>t+Math.max(1,Math.ceil(l.length/w)),0);
    for(const c of CP){
      const e=get(c.r);if(!e)continue;
      const fTxt=[c.r===17&&e.date?thShort(e.date):'',e.at?'ตรวจ '+e.at+' น.':'',detailText(e)].filter(Boolean).join('\n');
      setTxt('F'+c.r,fTxt,'left');
      const photos=(e.photos||[]).slice(0,2);
      const gc=ws.getCell('G'+c.r);gc.value=e.note||'';gc.alignment={vertical:'top',horizontal:'left',wrapText:true};
      const nl=e.note?lines(e.note,48):0;
      let hgt=Math.max(35,lines(fTxt,17)*19+8,nl*19+8);
      if(photos.length)hgt=Math.max(hgt,nl*19+100);
      ws.getRow(c.r).height=hgt;
      let i=0;for(const p of photos){
        try{const buf=await (await store.blob(p)).arrayBuffer();
          const id=wb.addImage({buffer:buf,extension:'jpeg'});
          const E=9525;ws.addImage(id,{tl:{nativeCol:6,nativeColOff:Math.round((4+i*172)*E),nativeRow:c.r-1,nativeRowOff:Math.round((nl?nl*25+6:5)*E)},ext:{width:165,height:112},editAs:'oneCell'});i++}catch(_){}
      }
    }
    const s=settings||{};
    const sig=(n,p,defP)=>`(${n?'   '+n+'   ':'....................................................'})\nตำแหน่ง ${p||defP}`;
    setTxt('A19',sig(s.cName,s.cPos,'....................'));setTxt('D19',sig(s.rName,s.rPos,'แผนกสารสนเทศ'));setTxt('G19',sig(s.aName,s.aPos,'....................'));
    ws.pageSetup.printArea='A1:I20';
    const out=await wb.xlsx.writeBuffer();
    const name=`FM-ITM-01-13 สำรวจกล้อง CCTV ${mLabel(ym)}.xlsx`;
    await dl.save({filename:name,data:new Blob([out])});
    toast('บันทึกไฟล์แล้ว');
  }catch(err){
    const c=err&&err.code;
    if(c!=='declined')toast(c==='rate_limited'?'มีหน้าต่างดาวน์โหลดเปิดอยู่':'สร้างไฟล์ไม่สำเร็จ');
    console.error(err);
  }finally{if($('xls')){$('xls').disabled=false;$('xls').innerHTML='📊 Excel<small>ตามฟอร์ม .xlsx</small>'}}
}

  const grp=r=>DATEGROUPS.find(g=>g[0]===r),inGrp=r=>DATEGROUPS.some(g=>g.includes(r)&&g[0]!==r);
  const locSpan={'โรงงาน 1':5,'โรงงาน 2':5,'โชว์รูมกิ่งแก้ว':1},locNo={'โรงงาน 1':1,'โรงงาน 2':2,'โชว์รูมกิ่งแก้ว':3};let seen={};
  let rows='';
  CP.forEach(c=>{const e=get(c.r);rows+='<tr>';
    if(!seen[c.loc]){seen[c.loc]=1;rows+=`<td class="c" rowspan="${locSpan[c.loc]}">${locNo[c.loc]}</td><td class="c" rowspan="${locSpan[c.loc]}">${c.loc}</td>`}
    const g=grp(c.r);if(g)rows+=`<td class="c" rowspan="${g.length}">${[...new Set(g.map(dateOf).filter(Boolean))].join('<br>')}</td>`;else if(!inGrp(c.r))rows+=`<td class="c">${dateOf(c.r)}</td>`;
    rows+=`<td>${esc(c.dept)}</td><td class="c">${c.time}</td><td class="${e&&e.status==='phone'?'bad':''}" style="width:190px">${e?(e.at?'ตรวจ '+esc(e.at)+' น.<br>':'')+esc(detailText(e)):''}</td>
     <td class="pc" style="width:300px">${e&&e.photos?e.photos.map(p=>`<img data-pid="${esc(p)}" src="${PH}">`).join(''):''}${e&&e.note?`<div>${esc(e.note)}</div>`:''}</td></tr>`});
  const sig=(t,n,p,dp)=>`<td>${t}<br><br>(${n?'&nbsp;&nbsp;'+esc(n)+'&nbsp;&nbsp;':'.......................................................'})<br>ตำแหน่ง ${esc(p||dp)}<br>วันที่........../........../...........</td>`;
  $('paper').innerHTML=`<table>
    <tr><td colspan="4" class="c b" style="font-size:17px">บริษัท ยูเนียนเบลท์ อินเตอร์เนชั่นเนล จำกัด</td></tr>
    <tr><td rowspan="3" class="c" style="width:150px"><img src="${LOGO}" style="height:72px"></td><td rowspan="2" class="c b" style="font-size:16px">เอกสาร ( Work form )</td><td class="b" style="width:240px">รหัสเอกสาร ( Doc No. )</td><td class="c" style="width:150px">FM-ITM-01-13</td></tr>
    <tr><td class="b">แก้ไขครั้งที่ ( Revision )</td><td class="c">00</td></tr>
    <tr><td class="c b" style="font-size:15px">เรื่อง / Title : แบบฟอร์มการสำรวจดูกล้องวงจรปิด(cctv)</td><td class="b">วันที่บังคับใช้งาน ( Effective Date )</td><td class="c">1/11/2568</td></tr>
    <tr><td colspan="4" class="c">รายละเอียดการตรวจสอบการใช้โทรศัพท์ในเวลาปฏิบัติงาน ประจำเดือน ${mLabel(ym)}</td></tr></table>
   <table style="margin-top:-1px"><tr><th style="width:52px">จุดที่</th><th style="width:110px">สถานที่</th><th style="width:96px">ว,ด,ป</th><th>แผนก</th><th style="width:100px">ตรวจเวลา</th><th>รายละเอียด</th><th>ภาพประกอบ+หมายเหตุ</th></tr>${rows}</table>
   <table class="sig" style="margin-top:-1px"><tr>${sig('ผู้จัดทำ(Creator)',s.cName,s.cPos,'....................')}${sig('ผู้ทบทวน(Reviewed by)',s.rName,s.rPos,'แผนกสารสนเทศ')}${sig('ผู้อนุมัติ(Approved by)',s.aName,s.aPos,'....................')}</tr></table>`;
  return hydrate($('paper')).then(()=>Promise.all([...$('paper').querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r}))));
}
async function exportImage(kind){
  if(!window.html2canvas||(kind==='pdf'&&!window.jspdf)){toast('ตัวสร้างไฟล์ยังโหลดไม่เสร็จ ลองอีกครั้ง');return}
  const btn=$(kind);const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span><small>กำลังสร้าง…</small>';
  try{
    await buildPaper();try{await document.fonts.ready}catch(_){}
    const canvas=await html2canvas($('paper'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:1200});
    const base=`FM-ITM-01-13 สำรวจกล้อง CCTV ${mLabel(ym)}`;
    let data,filename;
    if(kind==='png'){data=await new Promise(r=>canvas.toBlob(r,'image/png'));filename=base+'.png'}
    else{
      const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
      const W=297,H=210,m=6,iw=W-m*2,ih=H-m*2,fullH=canvas.height*iw/canvas.width;
      if(fullH<=ih/0.6){const k=Math.min(1,ih/fullH);const w=iw*k,hh=fullH*k;pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',(W-w)/2,m,w,hh)}
      else for(let y=0,pg=0,ph=ih*canvas.width/iw;y<canvas.height;y+=ph,pg++){
        const sh=Math.min(ph,canvas.height-y);const c=document.createElement('canvas');c.width=canvas.width;c.height=sh;
        c.getContext('2d').drawImage(canvas,0,y,canvas.width,sh,0,0,canvas.width,sh);
        if(pg)pdf.addPage();pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',m,m,iw,sh*iw/canvas.width);
      }
      data=pdf.output('blob');filename=base+'.pdf';
    }
    await dl.save({filename,data});toast('บันทึกไฟล์แล้ว');
  }catch(err){const c=err&&err.code;if(c!=='declined')toast(c==='rate_limited'?'มีหน้าต่างดาวน์โหลดเปิดอยู่':'สร้างไฟล์ไม่สำเร็จ');console.error(err)}
  finally{$('paper').innerHTML='';if($(kind)){$(kind).disabled=false;$(kind).innerHTML=old}}
}

/* ---------- events ---------- */
$('main').onclick=ev=>{
  const c=ev.target.closest('.cp');if(c){editor(+c.dataset.r);return}
  if(ev.target.closest('#xls')){exportXlsx();return}
  if(ev.target.closest('#pdf')){exportImage('pdf');return}
  if(ev.target.closest('#png')){exportImage('png');return}
  if(ev.target.closest('#sig')){if(mode!=='db'||!canW){toast('ไม่มีสิทธิ์แก้ไข');return}sigEditor();return}
  if(ev.target.closest('#login')){msal.loginRedirect({scopes:SCOPES,prompt:'select_account'});return}
  if(ev.target.closest('#retry')){location.reload();return}
  if(ev.target.closest('#resetcfg')){mode='setup';render();return}
  if(ev.target.closest('#c_demo')){localStorage.setItem('cctv-cfg',JSON.stringify({clientId:'DEMO'}));location.reload();return}
  if(ev.target.closest('#c_save')){const v={clientId:$('c_cid').value.trim(),tenantId:$('c_tid').value.trim(),siteUrl:$('c_site').value.trim().replace(/\/+$/,'')};
    if(!v.clientId||!v.siteUrl){toast('กรอก Client ID และ SharePoint site URL');return}localStorage.setItem('cctv-cfg',JSON.stringify(v));location.reload()}
};
$('tabs').onclick=ev=>{const b=ev.target.closest('[data-t]');if(b){tab=b.dataset.t;render();window.scrollTo({top:0})}};
const shift=n=>{let[y,m]=ym.split('-').map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}ym=y+'-'+pad(m);render()};
$('mPrev').onclick=()=>shift(-1);$('mNext').onclick=()=>shift(1);
$('who').onclick=()=>{
  openSheet(`<h3>${esc(me)}</h3><div style="font-size:13.5px;color:var(--sub)">${esc(account?account.username:'โหมดทดลอง')}</div>
   <div class="sbtns"><button id="w_c">ปิด</button><button class="pri" id="w_out">ออกจากระบบ</button></div>`);
  $('w_c').onclick=closeSheet;
  $('w_out').onclick=()=>{if(msal&&account)msal.logoutRedirect({account});else{localStorage.removeItem('cctv-cfg');location.reload()}}};
init();
</script></body></html>
